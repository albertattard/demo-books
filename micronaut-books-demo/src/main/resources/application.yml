micronaut:
  application:
    name: 'Books Demo'

jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: none

datasources:
  default:
    url: 'jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MYSQL'
    username: 'demo'
    password: 'Books'
    dialect: 'MYSQL'
    driver-class-name: 'org.h2.Driver'

flyway:
  datasources:
    default:
      enabled: true
      locations: classpath:db/migration

endpoints:
  flyway:
    enabled: true
    sensitive: false
